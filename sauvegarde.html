<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Document</title>
    <!-- Add Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link the new styling -->
    <link rel="stylesheet" href="style.css">
    <script src="controles2.js"></script>
</head>

<body>
    <!-- Distracting Background Particles -->
    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="container">
        <form name="f" action="sauvegarder2.html" method="get" onsubmit="return controle()">
            <fieldset>
                <legend>Inscription</legend>

                <div class="form-group">
                    <label for="nom">Nom* :</label>
                    <input type="text" id="nom" placeholder="Votre nom">
                </div>

                <div class="form-group">
                    <label for="prenom">Prenom* :</label>
                    <input type="text" id="prenom" placeholder="Votre prénom">
                </div>

                <div class="form-group">
                    <label for="cin">CIN * :</label>
                    <input type="text" id="cin" placeholder="Votre CIN">
                </div>

                <div class="form-group">
                    <label for="age">Age* :</label>
                    <input type="text" id="age" placeholder="Votre âge">
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail * :</label>
                    <input type="text" id="email" placeholder="votre.email@exemple.com">
                </div>

                <div class="form-group">
                    <label>Niveau :</label>
                    <div class="radio-group">
                        <label><input type="radio" name="r" id="sec" value="1"> Secondaire</label>
                        <label><input type="radio" name="r" id="univ" value="2"> Universitaire</label>
                        <label><input type="radio" name="r" id="aut" value="3"> Autre</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="list">Modules de formation :</label>
                    <select id="list">
                        <option value="Choisir un module">Choisir un module</option>
                        <option value="Bureautique">Bureautique</option>
                        <option value="Système">Système</option>
                        <option value="Réseaux">Réseaux</option>
                        <option value="Programmation">Programmation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Langages de programmation :</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="l1" id="pt"> Python</label>
                        <label><input type="checkbox" name="l2" id="js"> JavaScript</label>
                        <label><input type="checkbox" name="l3" id="c"> C++</label>
                    </div>
                </div>

                <p class="required-note">(*) Champs obligatoires</p>

                <div class="form-actions">
                    <input type="submit" value="Envoyer" class="btn btn-primary">
                    <input type="reset" value="Annuler" class="btn btn-secondary">
                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
